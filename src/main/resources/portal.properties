# Benefits Portal configuration
# D. Farrow 2008; BC provider added 2011

jdbc.driver=oracle.jdbc.OracleDriver
jdbc.url=jdbc:oracle:thin:@benefits-db:1521:BENE
jdbc.username=portal_app

portal.crypto.provider=BC
portal.crypto.recordCipher=AES/CBC/PKCS5Padding
portal.crypto.recordKeyBits=128
portal.crypto.passwordDigest=SHA-1
portal.crypto.documentDigest=SHA-256

# Clearing house. TLSv1 pinned; they have not enabled 1.2 (BEN-3102).
portal.clearinghouse.host=claims.clearing-example.net
portal.clearinghouse.tls.protocol=TLSv1
portal.clearinghouse.tls.ciphers=TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_3DES_EDE_CBC_SHA
portal.clearinghouse.signature=SHA256withRSA

portal.keystore.type=PKCS12
portal.keystore.path=/opt/portal/conf/portal.p12
portal.keystore.keysize=2048
